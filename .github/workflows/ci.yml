name: CI
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PUB_CACHE: ${{ github.workspace }}/.ci-cache/pub
  CARGO_INCREMENTAL: '0'
jobs:
  base:
    name: Rust, Flutter and documentation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux Flutter dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - uses: ./.github/actions/setup
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: python scripts/check_docs.py
      - run: python scripts/check_ci.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/ci_build.py flutter-checks
  linux:
    needs: base
    uses: ./.github/workflows/build-linux.yml
  windows:
    needs: base
    uses: ./.github/workflows/build-windows.yml
  macos:
    needs: base
    uses: ./.github/workflows/build-macos.yml
  android:
    needs: base
    uses: ./.github/workflows/build-android.yml
  ios:
    needs: base
    uses: ./.github/workflows/build-ios.yml
  summary:
    if: always()
    needs: [base, linux, windows, macos, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate actual workflow outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('| Platform | Build workflow | Runtime |\n| --- | --- | --- |\n')
              for name in ['base', 'linux', 'windows', 'macos', 'android', 'ios']:
                  outcome = results[name]['result']
                  status = {'success':'PASS', 'failure':'FAIL'}.get(outcome, 'BLOCKED')
                  out.write(f'| {name} | {status} | NOT TESTED by compilation |\n')
              out.write('\nSee each build summary for Core, Flutter, Player and package outcomes. iOS Player NOT IMPLEMENTED.\n')
          PY
