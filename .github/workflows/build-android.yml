name: Build android
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PUB_CACHE: ${{ github.workspace }}/.ci-cache/pub
  CARGO_INCREMENTAL: '0'
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('.github/ci/toolchains.json', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
      - run: python scripts/ci_setup.py android
      - id: rust
        name: Compile Rust (android)
        run: python scripts/ci_build.py rust --platform android --arch ${{ matrix.abi }}
      - id: flutter
        name: Build Flutter (android)
        run: python scripts/ci_build.py flutter --platform android --arch ${{ matrix.abi }}
      - id: package
        name: Assemble experimental artifact and SHA-256
        run: python scripts/ci_build.py package --platform android --arch ${{ matrix.abi }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Actual per-stage outcomes
        if: always()
        run: >-
          python scripts/ci_build.py summary --platform android --arch ${{ matrix.abi }}
          --rust-outcome '${{ steps.rust.outcome }}'
          --flutter-outcome '${{ steps.flutter.outcome }}'
          --package-outcome '${{ steps.package.outcome }}'
