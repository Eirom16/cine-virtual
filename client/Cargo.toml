[package]
name = "cine-client"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
cine-transfer = { path = "../adapters/transfer" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
cine-transfer-model = { path = "../adapters/transfer-model" }
cine-core = { path = "../core" }
cine-rooms = { path = "../rooms" }
cine-protocol = { path = "../protocol" }
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util.workspace = true
uuid.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cine-player-mpv = { path = "../adapters/player-mpv" }
cine-local-media = { path = "../adapters/local-media" }
